<!doctype html><html lang="en"><meta charset="UTF-8"><style>body{margin:0;min-height:100vh;display:grid;place-content:center;text-align:center;background:#dfff85;color:#182517;font:16px system-ui}button{border:0;border-radius:30px;padding:14px 24px;background:#182517;color:white;font:inherit;cursor:pointer}h1{font-size:28px;margin:10px}p{margin:12px 0 24px}</style><body><p>COLOR PLAYGROUND</p><h1>What color is your day?</h1><p id="answer">Tap to discover a new mood.</p><button onclick="let a=['Inspired green','Sunset orange','Ocean blue','Berry pink'];let c=['#dfff85','#ffcf9b','#b2e2f5','#f5c2dc'];let i=Math.floor(Math.random()*4);document.body.style.background=c[i];document.getElementById('answer').textContent=a[i]">Change the mood ↗</button></body></html>
